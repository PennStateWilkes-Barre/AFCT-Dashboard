# Production stack: the app (from the published image), an nginx TLS front, and
# Postgres. `docker compose up -d` on the host runs all three.

# Bound container log growth; the default json-file driver keeps logs forever
# and can fill the host disk. Applied to every service.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  app:
    # CI pins this to the exact published digest on each push to main
    # (.github/workflows/publish-ghcr.yml), so deploys are reproducible.
    image: ghcr.io/pennstatecs/afct-dashboard@sha256:2d74f295df05c902daf35d726c44694ca35092e19a9cfca5cd3e837f00a93527
    container_name: afct-app
    restart: unless-stopped
    logging: *default-logging

    # Cap resources so a runaway (e.g. a stuck Java evaluator) can't take down the
    # host. Sized for the shipping evaluator settings: up to 5 concurrent
    # evaluators x 256 MB (~1.3 GB of JVMs) plus the Node server. Raise the memory
    # limit if you increase evaluator memory or concurrency in System Settings, or
    # grading will be OOM-killed.
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G

    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_USER: afct_user
      DB_NAME: afct
      WAIT_FOR_DB: 'true'
      MIGRATE_ON_START: 'true'
      SEED_ON_START: 'auto'
      # Grading runs in the isolated `worker` service below; the app must not also start
      # one (that would double-process the queue and give the evaluator internet egress
      # via the app's frontend network).
      RUN_SUBMISSION_WORKER: 'false'

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - frontend
      - backend

    expose:
      - '3000'

    volumes:
      - uploads_data:/app/public/uploads
      - private_uploads:/private/uploads
      # App writes the admin TLS cert here; nginx reads it (below).
      - tls_certs:/app/certs
      # ACME HTTP-01 challenge tokens; nginx serves them over HTTP (Let's Encrypt).
      - acme_challenge:/app/acme-challenge
      # Backups: read-only for listing/downloading. The app can request a backup
      # only by dropping a flag in the separate (writable) trigger volume, so it
      # can never modify or delete actual backups.
      - db_backups:/backups:ro
      - backup_triggers:/backup-triggers

    healthcheck:
      # Lightweight endpoint (static 200 JSON, no DB work) rather than rendering
      # the full homepage on every check.
      test: ['CMD-SHELL', 'curl -fsS http://localhost:3000/api/health >/dev/null || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      # A cold first boot runs `prisma migrate deploy` + seed before the server answers,
      # which on a small or busy host can take past a minute; keep it in `starting` (not
      # `unhealthy`) until then. Kept in step with deploy/docker-compose.yml.
      start_period: 150s

  nginx:
    # Custom image: pinned nginx + baked openssl + baked config (docker/nginx).
    build:
      context: ./docker/nginx
    container_name: afct-nginx
    restart: unless-stopped
    logging: *default-logging

    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

    # Wait for the app to be healthy (not just started) so nginx doesn't serve
    # 502s while the app is still booting/migrating.
    depends_on:
      app:
        condition: service_healthy

    networks:
      - frontend

    ports:
      - '80:80'
      - '443:443'

    volumes:
      - nginx_certs:/etc/nginx/certs
      - uploads_data:/usr/share/nginx/html/uploads
      # Admin TLS cert written by the app; nginx reads it (see entrypoint.sh).
      - tls_certs:/etc/nginx/custom-certs:ro
      # ACME HTTP-01 challenge webroot, written by the app; nginx serves it over HTTP.
      - acme_challenge:/var/www/acme-challenge:ro

    healthcheck:
      # A 301 from the HTTP→HTTPS redirect means nginx is serving (curl -f only
      # fails on >=400), so this confirms liveness without needing a valid cert.
      test: ['CMD-SHELL', 'curl -fsS -o /dev/null http://localhost/ || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  postgres:
    # Digest-pinned (tag kept for readability). Bump deliberately.
    image: postgres:15-alpine@sha256:fe0737ba566a2c5b2a28f34433c0a423261900ec17b9bf7ad115e1aae7e57f1b
    container_name: afct-postgres
    restart: unless-stopped
    logging: *default-logging

    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

    # POSTGRES_PASSWORD comes from .env.production.
    env_file:
      - .env.production
    environment:
      POSTGRES_DB: afct
      POSTGRES_USER: afct_user

    networks:
      - backend

    # Log slow queries (>500ms) and connection lifecycle for prod observability.
    command:
      - postgres
      - -c
      - log_min_duration_statement=500
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
      - -c
      - log_lock_waits=on

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U afct_user -d afct']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  db-backup:
    # The built backup image: Postgres (so pg_dump matches the server version exactly)
    # plus GNU tar and gpg, which backup.sh needs to write the single .tar.gz archive
    # holding the database dump AND the upload volumes (DB rows reference files by
    # name, so both are needed for a coherent restore). The raw postgres image only
    # has busybox tar, which silently dropped the database from the archive. The
    # schedule (on/off, hour, retention) comes from System Settings; see backup.sh.
    # Copy the db_backups volume off-host regularly: it protects against bad
    # data/migrations, but not host loss.
    build:
      context: ./docker/backup
    container_name: afct-db-backup
    restart: unless-stopped
    logging: *default-logging

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - backend

    # POSTGRES_PASSWORD comes from .env.production (backup.sh maps it to PGPASSWORD).
    env_file:
      - .env.production
    environment:
      PGHOST: postgres
      PGUSER: afct_user
      PGDATABASE: afct
      # Fallbacks used only if the settings row can't be read; the live values come
      # from System Settings (backupEnabled / backupHour / backupRetentionDays).
      BACKUP_ENABLED: 'true'
      BACKUP_HOUR: '2'
      BACKUP_RETENTION_DAYS: '14'

    entrypoint: ['/bin/sh', '/backup.sh']
    volumes:
      - ./docker/backup/backup.sh:/backup.sh:ro
      - db_backups:/backups
      # Upload volumes, read-only, snapshotted alongside the DB dump.
      - private_uploads:/snapshot/private-uploads:ro
      - uploads_data:/snapshot/public-uploads:ro
      # Watches here for the app's "back up now" flag.
      - backup_triggers:/backup-triggers

  # Submission evaluator, network-isolated. Same image as the app, run as a standalone
  # worker on the internal `backend` network ONLY: it reaches Postgres to record grades but
  # has NO internet egress, so a hostile student submission run through the Java/cfganalyzer
  # evaluator cannot exfiltrate data or probe internal services. This is the ONLY place
  # grading happens (the app sets RUN_SUBMISSION_WORKER=false). CI pins this image line
  # alongside the app's (same global sed), so both track the same digest.
  worker:
    image: ghcr.io/pennstatecs/afct-dashboard@sha256:2d74f295df05c902daf35d726c44694ca35092e19a9cfca5cd3e837f00a93527
    container_name: afct-worker
    restart: unless-stopped
    logging: *default-logging
    command: ['npx', 'tsx', 'src/worker.ts']

    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
          pids: 512

    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_USER: afct_user
      DB_NAME: afct
      WAIT_FOR_DB: 'true'
      # The app container owns migrations + seeding; the worker must not race it.
      MIGRATE_ON_START: 'false'
      SEED_ON_START: 'false'
      CFGANALYZER_BINARY: /app/bin/cfganalyzer

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - backend

    volumes:
      # Reads submission + answer-key files only; never writes uploads (grades -> DB).
      - private_uploads:/private/uploads:ro

volumes:
  postgres_data:
  uploads_data:
  private_uploads:
  nginx_certs:
  tls_certs:
  acme_challenge:
  db_backups:
  backup_triggers:

networks:
  # Public edge + the app's outbound needs (Let's Encrypt/ACME, hCaptcha siteverify).
  frontend:
    driver: bridge
  # Internal only: no gateway, so no internet egress in either direction. Postgres, the
  # backup sidecar, and the evaluator worker live here.
  backend:
    driver: bridge
    internal: true
